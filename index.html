<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APAC Market Radar — ib vogt</title>
<style>
  :root { --green: #2E7D32; --green-lt: #E8F5E9; --green-dk: #1B5E20; --muted: #757575; --border: #E0E0E0; --bg: #F5F5F5; --surface: #FFFFFF; --text: #212121; --text2: #616161; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --green: #4CAF50; --green-lt: #1B3A1C; --green-dk: #A5D6A7; --muted: #9E9E9E; --border: #333; --bg: #121212; --surface: #1E1E1E; --text: #F5F5F5; --text2: #BDBDBD; } }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .layout { display: flex; height: 100vh; height: 100dvh; }
  .sidebar { width: 200px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--green); margin-bottom: 2px; }
  .sidebar-head h1 { font-size: 13px; font-weight: 600; color: var(--text); }
  .editions-label { padding: 10px 16px 4px; font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
  .week-list { flex: 1; overflow-y: auto; }
  .wk { padding: 10px 16px; cursor: pointer; border-left: 2px solid transparent; border-bottom: 1px solid var(--border); transition: background .1s; }
  .wk:last-child { border-bottom: none; }
  .wk:hover { background: var(--bg); }
  .wk.active { border-left-color: var(--green); background: var(--green-lt); }
  .wk-num { font-size: 12px; font-weight: 600; color: var(--text); }
  .wk.active .wk-num { color: var(--green-dk); }
  .wk-range { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .badge { display: inline-block; margin-top: 4px; background: var(--green); color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 2px 7px; border-radius: 10px; }
  #viewer { flex: 1; height: 100%; border: none; background: var(--surface); }
</style>
<script src="https://res.cdn.office.net/teams-js/2.30.0/js/MicrosoftTeams.min.js"></script>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="logo">ib vogt APAC</div>
      <h1>Market Radar</h1>
    </div>
    <div class="editions-label">Editions</div>
    <div class="week-list">
      <div class="wk active" id="wk-42" onclick="sel(42)">
        <div class="wk-num">Week 42</div>
        <div class="wk-range">10–19 Oct 2026</div>
        <span class="badge">Latest</span>
      </div>
      <div class="wk" id="wk-41" onclick="sel(41)">
        <div class="wk-num">Week 41</div>
        <div class="wk-range">5–12 Oct 2026</div>
      </div>
      <div class="wk" id="wk-40" onclick="sel(40)">
        <div class="wk-num">Week 40</div>
        <div class="wk-range">28 Sep–4 Oct 2026</div>
      </div>
      <div class="wk" id="wk-3839" onclick="sel(3839)">
        <div class="wk-num">Week 38–39</div>
        <div class="wk-range">14–25 Sep 2026</div>
      </div>
    </div>
  </div>
  <iframe id="viewer" title="Dashboard"></iframe>
</div>
<script>
microsoftTeams.app.initialize()
  .then(() => console.log("APAC Radar loaded inside Microsoft Teams"))
  .catch(() => console.warn("Running outside Microsoft Teams"));
const FILES = {
  42:   'Week 42, 2026 - ibv APAC Dashboard.html',
  41:   'Week 41, 2026 - ibv APAC Dashboard.html',
  40:   'Week 40, 2026 - ibv APAC Dashboard.html',
  3839: 'Week 38-39, 2026 - ibv APAC Dashboard.html'
};
function sel(id) {
  document.querySelectorAll('.wk').forEach(el => el.classList.remove('active'));
  document.getElementById('wk-' + id).classList.add('active');
  document.getElementById('viewer').src = encodeURI(FILES[id]);
}
sel(42);
</script>
</body>
</html>
