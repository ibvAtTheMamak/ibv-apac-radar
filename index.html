    <p class="lead">The CRESS Acceleration Package on 21 September set the System Access Charge at MYR 0.14/kWh for firm solar+BESS. Three weeks later, on 14 October, the Energy Commission and PETRA briefed approximately 100 industry participants on an additional 4 sen/kWh surcharge — effective immediately and applicable until end-2027, bringing the SAC to 18 sen/kWh. Only 2 sen below the pre-September level of 20 sen. The stated reason was concern that a 14 sen SAC was too attractive — it would pull existing industrial customers off the national grid, reducing the load and revenue base for TNB's existing generation fleet, and potentially raising per-unit tariffs for remaining consumers under Regulatory Period 5 (2028–2030). The Deputy Minister's statement from October 13 reveals the context: of 62 data centres that had signed electricity supply agreements, 45 had begun operations — but combined actual consumption was only 1.37 GW against a contracted maximum load of 6 GW. The actual demand from data centres is running far below contracted capacity. Against that background, allowing large industrials to switch to CRESS at 14 sen — potentially reducing grid load further — was seen as a tariff design risk the government wasn't willing to accept. The reversal is significant because it happened before a single CRESS project beyond the HLGY/Bridge DC project in Kedah had broken ground at the 14 sen rate. Samaiden's CRESS EPCC pipeline, priced on 14 sen bankability assumptions, now faces a changed cost structure. The Budget 2027 green incentives (GITA, KWAP fund, government solar park) remain intact, but the grid access charge — the most important CRESS enabler — is now back in limbo pending RP5 methodology in 2028.</p>

    <h3>Prabowo replaced PLN's CEO hours after summoning him to the palace — and the new CEO is a renewables and project execution specialist</h3>
    <p class="lead">The sequence matters: on 14 October, President Prabowo summoned Suroso Isnandar — PLN's Director of Project Management and New and Renewable Energy — to the State Palace alongside Danantara CEO Rosan Roeslani and ESDM Minister Bahlil Lahadalia. Prabowo issued instructions to overhaul PLN's business model, increase efficiency and productivity, reduce the subsidy burden, and accelerate 100 GWp of solar panel deployment. Hours later, PLN held a virtual General Meeting of Shareholders and confirmed Suroso as the new President Director. The outgoing CEO, Darmawan Prasodjo, had served since December 2021 and was associated with the structural narrative around Indonesia's energy transition. The appointment of his successor — a career PLN insider whose most recent role was specifically running the renewable energy and project management division — signals a switch from structural ambition to execution priority. The Batam blackout earlier in the week, and prior large outages in Sumatra and Kalimantan through 2026, provided the operational pressure. This week's other Indonesia entry adds nuance: PLN's planned T-REC launch in 2028 — hourly supply-demand matching for data centres and RE100 corporates — shows the commercial side of the utility is actively building toward the market that the 100 GWp programme is meant to supply. The combined picture is of a utility under maximum pressure to deliver megawatts, while simultaneously trying to build the commercial infrastructure to monetise them.</p>

    <h3>Vena Energy is running the most aggressive capital deployment sequence in the Philippines radar this year</h3>
    <p class="lead">Three entries in ten days tell a tight story. July 30: Vena reaches financial close on the 500 MWp Ixus Bugallon at $310M from 8 international banks. October 7 (the missed entry, now added): the ERC extends the GEA-All charge suspension through December 2026, citing the PhP556.9M fund balance — regulatory continuity for projects like Ixus already in the programme. October 16: Norfund (Norwegian state development finance institution) and Impact Fund Denmark acquire a combined 49% equity stake in Ixus Bugallon — development finance coming in behind the commercial debt. October 19: Vena announces an additional P245 billion of investment to add 2.6 GWp to its existing ~0.9 GWp Philippine portfolio over two years. The sequence — financial close, development finance equity, then a large expansion announcement — is the fastest such sequence in the Philippine radar for any single developer. Vena's existing Philippine capacity (887 MW operational, ~1.26 GW under construction) already makes it one of the country's largest RE operators; the additional 2.6 GWp would more than double the current and construction-stage combined. For context: the entire GEA-4 was 10.2 GW across 123 projects; one developer announcing 2.6 GWp in a single week is notable concentration of capital at one player.</p>

  <div class="topic">
    <div class="topic-num">Topic 1 · From three Malaysia entries (Oct 9, 10, 11)</div>
    <h3>Malaysia's Budget 2027 gives institutional backing to the RE push that the CRESS Acceleration Package started</h3>
    <p class="lead">The CRESS Acceleration Package fixed the grid access charge at MYR 0.14/kWh three weeks ago and the G3nerasi Kinta deal followed within days. Budget 2027, tabled 9 October, now turns those one-off policy moves into a fiscal commitment across three distinct lines: grid, incentives and direct investment. TNB's RM43B grid programme for 2025-2027 was already approved, but the budget explicitly designates RM15B of it for National Grid Strengthening — covering AI integration, BESS and the transmission capacity needed to absorb the data-centre load the CRESS deals are bringing in. Green investment tax allowances are restructured and extended through 31 December 2030: CRESS solar projects fall under GITA Project Tier 2 (60% allowance on qualifying capex, set off against 70% of statutory income). The RM1B KWAP Climate Fund is earmarked in full for RE development and decarbonisation. A RM1.5B centralised solar park for government buildings adds direct public procurement. And 150MW of the 2,500MW LSS6 programme is reserved for Bumiputera companies. Taken together, Budget 2027 is not just one-year spending — it fixes the RE investment framework through the end of the decade. Every CRESS developer and LSS6 bidder now has certainty on both the grid-access charge (MYR 0.14/kWh) and the tax treatment for the next four years.</p>
    <div class="chart-b">
      <div class="hbar-row">

  <div class="topic">
    <div class="topic-num">Topic 2 · From three Vietnam entries (Oct 5, 8, 8)</div>
    <h3>Vietnam is restructuring the institution that holds its RE pipeline hostage — but the pipeline is still hostage while restructuring is underway</h3>
    <p class="lead">Vietnam's Electricity and Renewable Energy Authority announced this week that it is steering a multi-stage restructuring of EVN: EVNNPT (national transmission) to be separated from the group; state to divest stakes in EVN's generation companies; a new strategic national power corporation under consideration for multi-purpose hydro and nuclear assets; distribution and retail to be unbundled in a later stage. The stated goal is a competitive electricity market. That is the same structural direction South Korea and Malaysia have been moving, and the same problem every market in the radar is grappling with — how to get private RE capital into a grid that a state utility still controls. The complication is that EVN's existing relationship with the RE project pipeline is already broken. The same week, EPTC asked 172 wind and solar projects — representing billions in foreign investment — to renegotiate prices downward to the transitional tariff ceilings from Decision 21/2023. Developers dispute the legal basis for retroactive application; the dispute has been running since mid-2025. The projects are generating electricity; the tariff question determines whether the equity is worth anything. Restructuring EVN makes sense as a long-term institution-building move. But the 172 projects sitting in a tariff limbo do not benefit from a restructuring that will take years to implement — and S&P's October 7 gas weekly (in the S&P section below) shows the immediate consequence: Vietnam's gas-fired generation has surged to ~3 aGW, the strongest year-over-year increase in Southeast Asia, because RE is not filling the gap fast enough.</p>
  </div>

  <div class="topic">
    <div class="topic-num">Topic 3 · From three South Korea entries (Oct 7, 11, 11)</div>
    <h3>South Korea announced its biggest energy investment commitment in history — the same week a fourth major foreign investor explained why they left</h3>
    <p class="lead">The Korea Green Transformation (K-GX) plan — KRW 1,000 trillion ($747B) through 2035, including KRW 200T in fiscal spending — sets the most concrete numerical target to date for Korea's 100 GW RE goal, adds a 2040 coal phase-out roadmap, and dedicates sector-specific decarbonisation blueprints to steel, petrochemicals, refining, cement and semiconductors. In the same week, Iberdrola explained why it left after signing a 2021 MOU with GS Energy: PPA terms and REC calculation methods can change with each new administration, making 20-year investment decisions impossible. That is not a new complaint — it is exactly what Equinor said before halting its Ulsan and Chuja Island projects, what Corio said before closing its Korean subsidiary in March 2026, and what Shell said before its offshore wind exit. The domestic capital that has stepped in (SK/KKR, Brookfield's KRW 30T commitment, and this week's first wind-farm repowering by a Korean financial investor, Truston) is a real alternative. But the K-GX plan needs a scale of capital that domestic sources alone have not been able to mobilise for offshore wind. The plan's KRW 200T in fiscal funding is substantial; how much of it flows through structures that foreign institutional capital can access will determine whether the 100 GW target produces a domestic industry or a delayed one.</p>
  </div>

          <p>Budget 2027 (tabled 9 October 2026) announced the following energy and green-economy measures: (1) TNB to invest RM15B for National Grid Strengthening (out of its pre-approved RM43B 2025-2027 capex), covering AI integration, BESS and data-centre load management; (2) GITA/GITE green tax incentives restructured and extended to 31 December 2030; (3) RM1B KWAP Climate Fund directed in full to RE development and decarbonisation; (4) RM1.5B centralised solar park for government buildings; (5) 150 MW of LSS6's 2,500 MW programme reserved for Bumiputera companies; (6) UEM Lestra to invest RM1B in energy storage at KLIA and a 1 GW hybrid energy project in Johor; (7) Nur Madani rebate of up to RM200 for buyers of 4- or 5-star energy-efficient appliances; (8) Household electricity bill protection threshold extended from 600 kWh to 800 kWh/month until 31 December 2026 (covers >8 million domestic users).</p>

          <p>Budget 2027 restructures GITA for assets verified 1 January 2027–31 December 2030. GITA Project (for income-generating RE projects including CRESS): Tier 1 (green hydrogen, OTEC): 100% allowance; Tier 2 (RE systems, EV charging): 60% allowance, 70% statutory income set-off — this is the category covering CRESS solar projects. GITA Asset (own-consumption only) does not apply to CRESS or third-party supply; it covers assets used solely by the off-taking company for its own operations. The distinction matters for developer tax planning: CRESS developers use GITA Project Tier 2; their corporate off-takers may separately claim GITA Asset Tier 1 (100% allowance, 100% or 70% set-off) on their own-consumption RE assets.</p>

  <div class="topic">
    <div class="topic-num">Topic 1 · From five South Korea entries</div>
    <h3>South Korea rewrote its power market on a single day</h3>
    <p class="lead">30 September was unusually dense for a single day of policy movement: the Ministry of Climate, Energy and Environment held the public hearing on the detailed design of the auction-based CfD system replacing the RPS from 2027 (20-year fixed-price bilateral contracts with KEPCO, preferential pricing replacing the old REC multiplier); lifted Honam and Chungcheong grid connection restrictions that had blocked new solar for over two years — unlocking 2.6 GW without any new grid construction, using a flexible connection scheme with managed curtailment; and announced a target of 10 GW+ of new solar per year from 2027, against a first-half 2026 run rate of roughly 2 GW for the full half-year. Private platform companies that have built competing PPA-matching services also pushed back publicly against the Korean Energy Agency's proposed role as sole broker between RE generators and corporate buyers under the new system — a market-structure dispute that hasn't been resolved yet. The day before, Korea Zinc signed what looks like one of the first long-term fixed-price CPPAs to be structured ahead of the new system going live: 20 years, fixed price, 11 GWh/year from solar farms in three provinces, supply from December 2026. Corporate buyers aren't waiting for the transition to complete.</p>

  <div class="topic">
    <div class="topic-num">Topic 2 · From three Malaysia entries</div>
    <h3>Malaysia's CRESS has its first hyperscale anchor — and it's the biggest deal in the framework's history</h3>
    <p class="lead">Eight days after the CRESS Acceleration Package fixed the System Access Charge at MYR 0.14/kWh and mandated 10-year contracts (Sep 21), the G3nerasi Kinta consortium — SD Guthrie, Gamuda Energy and Gentari (PETRONAS) — signed a term sheet for a 680 MWac solar+BESS project in Perak, with an unnamed US-based multinational tech company as the offtaker on a 21-year Bilateral Energy Supply Contract, for estimated gross revenue of over RM10B across the contract term. That's the largest single CRESS commitment reported in the radar to date, and it likely wouldn't have been bankable at the previous MYR 0.20/0.40/kWh grid-access charge. Mah Sing and Kinergy Advancement (Oct 2) signed a non-binding term sheet the same week to evaluate captive power and CRESS frameworks for two data centre sites in Selangor and Johor — a different scale, but the same mechanism. The capacity backdrop helps explain why: Malaysia's operational data centre capacity is on track to nearly quadruple from 522 MW in Q1 2025 to 2,055 MW by end-2026, and pre-leased capacity hit 1.2 GW in H1 2026 — second in Asia-Pacific after Japan.</p>

  <div class="topic">
    <div class="topic-num">Topic 3 · From two Indonesia entries</div>
    <h3>Indonesia's 100 GWp programme is now in execution — two entries in two days show what that looks like in practice</h3>
    <p class="lead">The 100 GWp Solar Programme was formally launched in August; this week's two entries show what the transition from announcement to implementation actually involves. The Sep 30 entry reports 15 initial plants now in active development across six provinces — East Java, Central Java, West Java, Bali, Riau Islands and Bangka Belitung — with a projected Rp4.6T/year in state budget savings from reduced diesel consumption and Rp135T in total investment required. These aren't project proposals any more; they are confirmed government-led developments, and the government has said Danantara will step in if competitive IPP pricing cannot be achieved. Alongside that, the Sep 29 entry shows the RUPTL (Electricity Supply Business Plan) being formally revised to accommodate the 100 GWp target — with a plan to build 47,758 km of new transmission lines, target a national electrification rate above 99%, and push the energy resilience index to 7.13. The revision also explicitly flags that success could accelerate Indonesia's net-zero target by 10–15 years from 2060. And sitting alongside both: Sep 28 brings the Kolaka Nickel solar+BESS project (non-recourse financed by ICBC, StanChart and CITIC) — an example of industrial self-generation in the nickel sector, not part of the 100 GWp programme, but the same underlying trend of private RE adoption spreading beyond the utility sector.</p>

          <h3>South Korea lifts Honam and Chungcheong solar grid restrictions from 1 October — flexible connection scheme unlocks 2.6 GW; east coast restrictions to follow H1 2027</h3>

  <div class="topic">
    <div class="topic-num">Topic 1 · From one entry each in Singapore and Indonesia (×2)</div>
    <h3>Singapore is increasingly running its own decarbonisation through Indonesian solar</h3>
    <p class="lead">Three entries this fortnight all point the same way: Tuas Power signed a PPA to buy renewable electricity from a $12.3B solar cluster near Batam, Riau Islands, with imports starting 2027 (Sep 16). Keppel is separately structuring an Indonesian solar project to feed its own Jurong Island CCGT plant and, from there, Singapore data-centre customers (Sep 18). And Singapore's EMA opened public consultation on a formal framework for cross-border ASEAN REC trading — the mechanism that would let Singapore-based buyers retire certificates from generators like these (Sep 18). None of these are new in concept — Vena Energy and ERA have been building Riau Islands export capacity for years — but three separate entities (a retailer, an integrated energy major, and the regulator itself) all advancing the same import dependency in the same fortnight suggests it's moving from pilot to standing policy.</p>
    </div>

  <div class="topic">
    <div class="topic-num">Topic 2 · From four South Korea entries and one Malaysia entry</div>
    <h3>South Korea restructured its entire renewable-power support system in ten days</h3>
    <p class="lead">Four separate moves, one country, one fortnight: the 15-year-old Renewable Portfolio Standard — which cost KEPCO's five gencos a record KRW 2.06T in REC purchases in 2025 alone — will be scrapped for competitive auctions from 2027 (Sep 16). Those same five gencos (KOEN, KOMIPO, KOWEPO, KOSPO, EWP; ~53 GW combined) are being merged into a single "Korea Power Generation" entity by October 2027, with a dedicated Renewable Energy division (Sep 22). KPX opened its first ESS tender since the reform was announced — 1.18 GW/6.6 GWh, completion by February 2029 (Sep 25). And ESR, the Asia-Pacific real-asset manager, agreed to acquire Aquila Clean Energy APAC's 1.6 GW solar/BESS/wind platform, with Korea among its five markets (Sep 25) — foreign capital positioning itself ahead of the new system rather than waiting to see how it settles. Malaysia moved in a similar direction the same fortnight with its CRESS Acceleration Package (fixed grid-access charge, mandatory 10-year contracts, Sep 21) — a smaller, single-scheme version of the same instinct: replace open-ended compliance mechanisms with fixed, contractible terms.</p>
    </div>

  <div class="topic">
    <div class="topic-num">Topic 3 · From three Philippines entries</div>
    <h3>Land control, not capital, is the swing variable in Philippine solar right now</h3>
    <p class="lead">Three entries this fortnight, same underlying constraint: ACEN voluntarily surrendered two early-stage solar contracts — 336 MW at Pagbilao and 120 MW in Zambales — citing land acquisition and site access problems, not financing (Sep 22). The same week, APECO and China's Huge Energy signed an MoU for a 1 GW solar+BESS+WTE complex in Casiguran, Aurora — made possible precisely because APECO, as the site's economic-zone authority, could hand over 90 hectares directly (Sep 25). And Basic Energy broke ground on its 43 MWac Cadiz 1 plant only after an 18-month path from Certificate of Authority (March 2025) through EPC signing (March 2026) to site works (September 2026) — even with land already secured (Sep 23). Read together: land control is now the variable separating projects that die (ACEN's two cancellations), projects that move fast (APECO's SEZ-backed MoU), and projects that grind through on a normal but lengthy timeline (Basic Energy) — more than capital availability, which none of the three entries cite as the constraint.</p>
    </div>

          <p>The Visayas grid recorded 134 alert days through 14 September (94 yellow, 40 red), with a 140 MW supply deficit on 15 September triggering both yellow and red alerts in the same day. Cause: simultaneous forced outages of major coal plants (TVI 1, TVI 2, PEDC 3) plus limited Mindanao imports — 938.9 MW unavailable from 32 plants. DOE has mandated NGCP to install ~250 MW of battery storage, with internal simulations projecting a 50%+ reduction in future alert occurrences.</p>
